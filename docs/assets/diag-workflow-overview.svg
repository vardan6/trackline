<rect x="540" y="514" width="128" height="64" rx="10" fill="#f1effa" stroke="#4a3aa7" stroke-width="2"/>
<text x="604" y="539" font-size="15" fill="#4a3aa7" text-anchor="middle" font-weight="700">session-close</text>
<text x="604" y="559" font-size="12.5" fill="#52514e" text-anchor="middle">record the outcome</text>

<rect x="698" y="514" width="160" height="64" rx="10" fill="#f2f1ee" stroke="#898781" stroke-width="2"/>
<text x="778" y="539" font-size="14" fill="#52514e" text-anchor="middle" font-weight="700">open PR → merge</text>
<text x="778" y="559" font-size="12" fill="#898781" text-anchor="middle">clean history is fuel</text>

<line x1="312" y1="546" x2="336" y2="546" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="512" y1="546" x2="536" y2="546" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="670" y1="546" x2="694" y2="546" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>

<!-- findings back into slices -->
<path d="M425,510 Q330,436 219,396" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-mut)"/>
<text x="278" y="484" font-size="12.5" fill="#898781" text-anchor="middle" font-style="italic">validated findings → new slices</text>

<!-- caption -->
<text x="500" y="630" font-size="14" fill="#898781" text-anchor="middle" font-style="italic">blue = skill (slash command) · purple = session-close, the only writer of live state · gray = artifact / checkpoint</text>
</svg>
