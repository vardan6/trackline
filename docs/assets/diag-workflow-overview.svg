<line x1="822" y1="70" x2="842" y2="70" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>

<!-- plan -> plan review -->
<path d="M911,104 v28 a8,8 0 0 1 -8,8 H228 a8,8 0 0 0 -8,8 v26" fill="none" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<text x="560" y="134" font-size="13" fill="#898781" text-anchor="middle" font-style="italic">fresh session</text>

<!-- ===== band: PLAN REVIEW ===== -->
