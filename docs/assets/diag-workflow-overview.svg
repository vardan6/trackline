<text x="773" y="227" font-size="12" fill="#898781" text-anchor="middle">known-good checkpoint</text>

<line x1="312" y1="214" x2="336" y2="214" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="502" y1="214" x2="526" y2="214" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="660" y1="214" x2="684" y2="214" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>

<!-- plan review -> implement -->
<path d="M773,248 v28 a8,8 0 0 1 -8,8 H213 a8,8 0 0 0 -8,8 v26" fill="none" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
