<rect x="310" y="326" width="170" height="64" rx="10" fill="#ffffff" stroke="#898781" stroke-width="2"/>
<text x="395" y="351" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">implement + verify</text>
<text x="395" y="371" font-size="12.5" fill="#52514e" text-anchor="middle">code · test · inspect</text>

<rect x="510" y="326" width="150" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<text x="585" y="351" font-size="15" fill="#1c5cab" text-anchor="middle" font-weight="700">doc-update</text>
<text x="585" y="371" font-size="12.5" fill="#52514e" text-anchor="middle">if behavior changed</text>

<rect x="690" y="326" width="160" height="64" rx="10" fill="#f1effa" stroke="#4a3aa7" stroke-width="2"/>
<text x="770" y="351" font-size="15" fill="#4a3aa7" text-anchor="middle" font-weight="700">session-close</text>
<text x="770" y="371" font-size="12" fill="#52514e" text-anchor="middle">STEP — or SESSION to stop</text>

<line x1="282" y1="358" x2="306" y2="358" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="482" y1="358" x2="506" y2="358" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<line x1="662" y1="358" x2="686" y2="358" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>

<!-- slice loop -->
<path d="M770,394 Q490,462 213,394" fill="none" stroke="#1c5cab" stroke-width="2.5" marker-end="url(#ar-dark)"/>
<text x="490" y="442" font-size="13" fill="#1c5cab" text-anchor="middle">× N — take another slice while context stays light</text>

<!-- implement -> review -->
<path d="M850,358 h86 a8,8 0 0 1 8,8 v92 a8,8 0 0 1 -8,8 H228 a8,8 0 0 0 -8,8 v32" fill="none" stroke="#52514e" stroke-width="2.5" marker-end="url(#ar-sec)"/>
<text x="640" y="461" font-size="13" fill="#898781" text-anchor="middle" font-style="italic">phase done — review before the PR</text>

<!-- ===== band: REVIEW ===== -->
<rect x="12" y="492" width="976" height="104" rx="12" fill="#fef9f6" stroke="#eb6834" stroke-width="1.5"/>
<rect x="24" y="530" width="94" height="32" rx="16" fill="#eb6834"/>
