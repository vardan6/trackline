<rect x="340" y="182" width="160" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<text x="420" y="207" font-size="15" fill="#1c5cab" text-anchor="middle" font-weight="700">review-triage</text>
