<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif">
  <title id="title">Trackline on the human–agent cooperation spectrum</title>
  <desc id="desc">A continuous spectrum from direct coding through AI-assisted coding and vibe coding to agentic coding and agentic operation. Trackline is marked at agentic coding: it is beyond vibe coding because an agent executes bounded development loops, but humans still govern the wider workflow.</desc>
  <defs>
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="62" y1="150" x2="1138" y2="150">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="0.52" stop-color="#5e64c7"/>
      <stop offset="1" stop-color="#8b3fa7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3a2b73" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="390" fill="#ffffff"/>

  <text x="48" y="45" font-size="28" font-weight="700" fill="#171717">Where Trackline sits today</text>
  <text x="48" y="74" font-size="16" fill="#66645f">A spectrum of delegated execution—not a ranking of quality</text>

  <text x="48" y="118" font-size="13" font-weight="700" fill="#1c5cab">MORE HUMAN-EXECUTED</text>
  <text x="1152" y="118" font-size="13" font-weight="700" text-anchor="end" fill="#7b3197">MORE SYSTEM-EXECUTED</text>

  <line x1="62" y1="150" x2="1138" y2="150" stroke="url(#spectrum)" stroke-width="7" stroke-linecap="round"/>
  <path d="M63 138 L43 150 L63 162" fill="none" stroke="#2a78d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1137 138 L1157 150 L1137 162" fill="none" stroke="#8b3fa7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g text-anchor="middle">
    <circle cx="100" cy="150" r="9" fill="#2a78d6" stroke="#fff" stroke-width="4"/>
    <text x="100" y="191" font-size="16" font-weight="700" fill="#1c5cab">Direct coding</text>
    <text x="100" y="214" font-size="14" fill="#77746f">human writes</text>

    <circle cx="345" cy="150" r="9" fill="#466fcf" stroke="#fff" stroke-width="4"/>
    <text x="345" y="191" font-size="16" font-weight="700" fill="#3457aa">AI-assisted coding</text>
    <text x="345" y="214" font-size="14" fill="#77746f">AI suggests</text>

    <circle cx="590" cy="150" r="9" fill="#6260c3" stroke="#fff" stroke-width="4"/>
    <text x="590" y="191" font-size="16" font-weight="700" fill="#514ead">Vibe coding</text>
    <text x="590" y="214" font-size="14" fill="#77746f">human steers outcomes</text>

    <circle cx="835" cy="150" r="21" fill="#fff" stroke="#4a3aa7" stroke-width="5" filter="url(#soft-shadow)"/>
    <circle cx="835" cy="150" r="9" fill="#4a3aa7"/>
    <path d="M835 124 V106" stroke="#4a3aa7" stroke-width="3"/>
    <rect x="747" y="82" width="176" height="29" rx="14.5" fill="#4a3aa7"/>
    <text x="835" y="102" font-size="13" font-weight="700" fill="#fff">MY WORKFLOW IS HERE</text>
    <text x="835" y="191" font-size="17" font-weight="700" fill="#4a3aa7">Agentic coding</text>
    <text x="835" y="214" font-size="14" fill="#77746f">agent executes a bounded task</text>

    <circle cx="1080" cy="150" r="9" fill="#8b3fa7" stroke="#fff" stroke-width="4"/>
    <text x="1080" y="191" font-size="16" font-weight="700" fill="#7b3197">Agentic operation</text>
    <text x="1080" y="214" font-size="14" fill="#77746f">system runs the workflow</text>
  </g>

  <path d="M610 246 V238 H815 V246" fill="none" stroke="#386fc5" stroke-width="2" stroke-linecap="round"/>
  <text x="712" y="275" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1c5cab">Beyond vibe coding</text>
  <text x="712" y="301" font-size="14" text-anchor="middle" fill="#52514e">Plans, edits, runs tools, tests, and iterates</text>
  <text x="712" y="323" font-size="14" text-anchor="middle" fill="#52514e">within a confirmed vertical slice.</text>

  <path d="M855 246 V238 H1060 V246" fill="none" stroke="#8b3fa7" stroke-width="2" stroke-linecap="round"/>
  <text x="958" y="275" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7b3197">Not agentic operation yet</text>
  <text x="958" y="301" font-size="14" text-anchor="middle" fill="#52514e">Humans initiate cycles, approve scope,</text>
  <text x="958" y="323" font-size="14" text-anchor="middle" fill="#52514e">triage findings, and authorize commits.</text>

  <text x="600" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#14835e">HUMAN-GOVERNED AGENTIC CODING</text>
</svg>
